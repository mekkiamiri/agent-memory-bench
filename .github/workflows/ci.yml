name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Tests (aucun appel à un vrai modèle)
        run: mvn -B verify
      - name: Rapport du banc (faux modèle)
        run: mvn -q -B exec:java >> "$GITHUB_STEP_SUMMARY"
